name: RuboCop Lint Check

on:
  push:
    branches:
      - main
      - develop
  pull_request:
    branches:
      - main
      - develop

jobs:
  rubocop:
    runs-on: ubuntu-24.04
    steps:
      - name: 🔄 リポジトリをチェックアウト
        uses: actions/checkout@v4

      - name: 💎 Ruby 環境をセットアップ
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: 3.2.10
          bundler-cache: true

      - name: 📦 必要な gem をインストール
        run: bundle install

      - name: 🔍 Rubocop を実行
        run: bundle exec rubocop --parallel
